name: tagged-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    #container:
    #  image: debian:buster

    steps:

      - name: Install third party dependencies
        run: sudo apt install build-essential libgcrypt-dev zlib1g-dev

      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Built on EL8 (glibc 2.28) so the same binaries, .deb and .rpm run on
      # Debian 11+, Ubuntu 22.04+, RHEL/Rocky/Alma 8+ and Fedora.
      - name: Build (EL8, glibc 2.28 baseline)
        run: |
          docker run --rm -v "$PWD:/src" -w /src rockylinux:8 bash -c '
            dnf install -y -q gcc make zlib-devel libgcrypt-devel && make all'
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Check glibc baseline
        run: |
          for bin in ldb libldb.so; do
            max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$bin requires glibc $max"
            [ "$(printf '%s\n' "$max" 2.28 | sort -V | tail -1)" = "2.28" ] || { echo "$bin requires glibc > 2.28"; exit 1; }
          done

      - name: Collect artifacts
        run: |
          mkdir -p ./artifacts/
          cp ldb ./artifacts/ldb
          cp libldb.so ./artifacts/libldb.so
          echo "Produced artifact at ${PWD}/artifacts/ldb"

      - name: 'Tar files'
        run: tar czvf "ldb-${GITHUB_REF_NAME//\//-}-linux-amd64.tar.gz" -C artifacts/ .

      - name: Prepare deb package
        id: build_deb
        # package.sh directly: make prepare_*_package would rebuild on the runner
        run: |
          ./package.sh deb "$(./version.sh)"
          echo "debpkg_file_name=$(ls *.deb)" >> $GITHUB_OUTPUT

      - name: Prepare rpm package
        run: |
          ./package.sh rpm "$(./version.sh)"
          echo "rpmpkg_file_name=$(ls dist/rpm/RPMS/x86_64/*.rpm)" >> $GITHUB_OUTPUT

      - name: Show the artifacts
        # Items placed in /artifacts in the container will be in
        # ${PWD}/artifacts on the host.
        run: |
          ls -al "${PWD}/artifacts"
          ls -al "${PWD}"
          ls -al "${PWD}/dist/rpm/RPMS/x86_64/"

      # Manual runs (workflow_dispatch) don't create a release: keep the packages
      # as workflow artifacts so they can be tested
      - name: Upload packages
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ./*.tar.gz
            ./*.deb
            ./dist/rpm/RPMS/x86_64/*.rpm

      - name: Create Draft Release ${{ github.ref_type }} - ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            ./*.tar.gz
            ./*.deb
            ./dist/rpm/RPMS/x86_64/*.rpm
